name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:          # permite correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c2410c&color_dots=#ebedf0,#ffe0c2,#ffb870,#ff8f2e,#c2410c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7a18&color_dots=#161b22,#4a2308,#8a3f0c,#d9660f,#ff7a18

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
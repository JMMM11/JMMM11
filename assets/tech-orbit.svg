<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Technologies orbiting around web development" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="cg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>.chip { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 13px; font-weight: 700; } .core { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 16px; font-weight: 700; fill: #fff; }</style>
  <rect width="560" height="360" rx="14" fill="#0d1117"/>
  <circle cx="280" cy="180" r="85" fill="none" stroke="#ffc27a" stroke-opacity="0.35" stroke-dasharray="4 8">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="180" r="165" fill="none" stroke="#ff7a18" stroke-opacity="0.3" stroke-dasharray="4 10">

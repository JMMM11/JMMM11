<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Skill focus bars" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Para cambiar un nivel: edita el numero en to="..." de esa barra (maximo 460) y el cx final. -->
  <defs>
    <filter id="sg" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .lbl { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 14px; fill: #c9d1d9; }
    .ttl { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 13px; fill: #8b949e; letter-spacing: 2px; }
  </style>
  <rect width="760" height="280" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="758" height="278" rx="13" fill="none" stroke="#ffc27a" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.12;0.5;0.12" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="34" class="ttl">SKILL FOCUS</text>
  <text x="30" y="71" class="lbl">HTML · CSS · JavaScript</text>
  <rect x="250" y="58" width="460" height="14" rx="7" fill="#161b22"/>
  <rect x="250" y="58" width="0" height="14" rx="7" fill="#ff9a3c" filter="url(#sg)">
    <animate attributeName="width" from="0" to="322" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <circle cx="250" cy="65" r="5" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.4s" fill="freeze"/>
    <animate attributeName="cx" from="250" to="572" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </circle>
  <text x="30" y="113" class="lbl">React</text>
  <rect x="250" y="100" width="460" height="14" rx="7" fill="#161b22"/>

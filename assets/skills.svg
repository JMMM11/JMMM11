    <animate attributeName="cx" from="250" to="503" dur="1.4s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </circle>
  <text x="30" y="155" class="lbl">Python</text>
  <rect x="250" y="142" width="460" height="14" rx="7" fill="#161b22"/>
  <rect x="250" y="142" width="0" height="14" rx="7" fill="#fb923c" filter="url(#sg)">
    <animate attributeName="width" from="0" to="276" dur="1.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>

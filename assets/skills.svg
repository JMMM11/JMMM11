    <animate attributeName="width" from="0" to="253" dur="1.4s" begin="1.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <circle cx="250" cy="191" r="5" fill="#fff" opacity="0">

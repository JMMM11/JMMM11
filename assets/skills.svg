    <animate attributeName="width" from="0" to="230" dur="1.4s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <circle cx="250" cy="233" r="5" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="1.8s" fill="freeze"/>
    <animate attributeName="cx" from="250" to="480" dur="1.4s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </circle>
</svg>

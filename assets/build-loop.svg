<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Development loop</title>
  <desc id="desc">An animated process from idea to design, build, refine and back to idea.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffc27a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="188" rx="18" fill="#0d1117" stroke="#ff7a18" stroke-opacity=".28"/>
  <path d="M130 82H770" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 82H770" stroke="url(#orange)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 550">
    <animate attributeName="stroke-dashoffset" values="0;-640" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Cascadia Code,Consolas,monospace" text-anchor="middle">
    <g transform="translate(130 82)">
      <circle r="31" fill="#161b22" stroke="#ff7a18" stroke-width="2"/>
      <circle r="7" fill="#ff7a18" filter="url(#glow)"/>
      <text y="58" fill="#22d3ee" font-size="15" font-weight="700">IDEA</text>
      <text y="79" fill="#8b949e" font-size="11">define the value</text>
    </g>
    <g transform="translate(343 82)">
      <circle r="31" fill="#161b22" stroke="#ff7a18" stroke-width="2"/>
      <circle r="7" fill="#ff7a18" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
      <text y="58" fill="#c084fc" font-size="15" font-weight="700">DESIGN</text>
      <text y="79" fill="#8b949e" font-size="11">shape the experience</text>
    </g>
    <g transform="translate(557 82)">
      <circle r="31" fill="#161b22" stroke="#ff7a18" stroke-width="2"/>
      <circle r="7" fill="#ff7a18" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      <text y="58" fill="#34d399" font-size="15" font-weight="700">BUILD</text>
      <text y="79" fill="#8b949e" font-size="11">connect every layer</text>
    </g>
    <g transform="translate(770 82)">
      <circle r="31" fill="#161b22" stroke="#ff7a18" stroke-width="2"/>
      <circle r="7" fill="#ff7a18" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text y="58" fill="#f472b6" font-size="15" font-weight="700">REFINE</text>
      <text y="79" fill="#8b949e" font-size="11">polish the details</text>
    </g>
  </g>

  <path d="M770 43C710 8 190 8 130 43" fill="none" stroke="#ff7a18" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M128 43l11-4-4 11" fill="#ff7a18"/>
</svg>

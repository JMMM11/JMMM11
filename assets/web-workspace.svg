<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-labelledby="title desc">
  <title id="title">Desktop web development workspace</title>
  <desc id="desc">An animated browser window connected to interface, API and database layers.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc27a"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="558" height="328" rx="18" fill="#0d1117" stroke="#ff7a18" stroke-opacity=".28"/>

  <g transform="translate(40 32)">
    <rect width="480" height="218" rx="12" fill="url(#screen)" stroke="#30363d" stroke-width="2"/>
    <rect width="480" height="34" rx="12" fill="#21262d"/>
    <rect y="24" width="480" height="10" fill="#21262d"/>
    <circle cx="18" cy="17" r="5" fill="#c2410c"/><circle cx="36" cy="17" r="5" fill="#ff7a18"/><circle cx="54" cy="17" r="5" fill="#ffc27a"/>
    <rect x="78" y="9" width="360" height="16" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="96" y="21" fill="#8b949e" font-family="Consolas,monospace" font-size="10">https://localhost/build</text>

    <g transform="translate(24 58)">
      <rect width="126" height="136" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="28" fill="#ff7a18" font-family="Consolas,monospace" font-size="12">JMMM11</text>
      <rect x="16" y="43" width="88" height="5" rx="2.5" fill="#ff7a18" opacity=".8"/>
      <rect x="16" y="58" width="70" height="4" rx="2" fill="#8b949e"/>
      <rect x="16" y="70" width="92" height="4" rx="2" fill="#8b949e" opacity=".7"/>
      <rect x="16" y="94" width="94" height="25" rx="5" fill="url(#accent)"/>
      <text x="63" y="111" fill="#0d1117" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="700">EXPLORE</text>
    </g>

    <g transform="translate(172 58)" font-family="Consolas,monospace" font-size="12">
      <text x="0" y="18" fill="#8b949e">01</text><text x="28" y="18" fill="#ff7a18">const</text><text x="68" y="18" fill="#c9d1d9"> idea =</text><text x="122" y="18" fill="#ffc27a"> "build"</text><text x="180" y="18" fill="#c9d1d9">;</text>
      <text x="0" y="42" fill="#8b949e">02</text><text x="28" y="42" fill="#ff7a18">await</text><text x="70" y="42" fill="#c9d1d9"> design(idea);</text>
      <text x="0" y="66" fill="#8b949e">03</text><text x="28" y="66" fill="#ff7a18">await</text><text x="70" y="66" fill="#c9d1d9"> develop();</text>
      <text x="0" y="90" fill="#8b949e">04</text><text x="28" y="90" fill="#ff7a18">await</text><text x="70" y="90" fill="#c9d1d9"> refine();</text>
      <text x="0" y="114" fill="#8b949e">05</text><text x="28" y="114" fill="#ff7a18">return</text><text x="76" y="114" fill="#ffc27a"> polished</text><text x="132" y="114" fill="#c9d1d9">;</text>
      <rect x="28" y="127" width="7" height="14" fill="#ff7a18"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <path d="M280 250v22" stroke="#ff7a18" stroke-width="3"/>
  <path d="M220 274h120" stroke="#ff7a18" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(80 292)" font-family="Consolas,monospace" font-size="11" font-weight="700">
    <g><circle cx="8" cy="8" r="8" fill="#ff7a18" filter="url(#glow)"/><text x="24" y="12" fill="#c9d1d9">INTERFACE</text></g>
    <g transform="translate(145)"><circle cx="8" cy="8" r="8" fill="#ff7a18" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle><text x="24" y="12" fill="#c9d1d9">API</text></g>
    <g transform="translate(250)"><circle cx="8" cy="8" r="8" fill="#ff7a18" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle><text x="24" y="12" fill="#c9d1d9">DATABASE</text></g>
  </g>
</svg>

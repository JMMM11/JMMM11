<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="Project card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- PLANTILLA: copia este archivo como project-1.svg y cambia: titulo, descripcion y etiquetas. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a18"/><stop offset="0.5" stop-color="#ffc27a"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 19px; font-weight: 700; fill: #f0f6fc; }
    .d { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 13px; fill: #8b949e; }
    .g { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 12px; font-weight: 700; }
    .l { font-family: "Cascadia Code","Cascadia Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace; font-size: 13px; fill: #ffc27a; }
  </style>
  <rect width="400" height="190" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="397" height="187" rx="13" fill="none" stroke="url(#b)" stroke-width="2" stroke-opacity="0.45">
    <animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="24" width="6" height="26" rx="3" fill="url(#b)"/>
  <text x="42" y="44" class="t">Project Name</text>
  <text x="24" y="80" class="d">Short description of what this project does</text>
  <text x="24" y="100" class="d">and the problem it solves.</text>
  <rect x="24" y="122" width="62" height="24" rx="12" fill="#ff7a18" fill-opacity="0.15" stroke="#ff7a18"/>
  <text x="55" y="138" text-anchor="middle" class="g" fill="#ff9a3c">React</text>
  <rect x="94" y="122" width="70" height="24" rx="12" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c"/>
  <text x="129" y="138" text-anchor="middle" class="g" fill="#fb923c">Python</text>
  <rect x="172" y="122" width="96" height="24" rx="12" fill="#ffc27a" fill-opacity="0.15" stroke="#ffc27a"/>
  <text x="220" y="138" text-anchor="middle" class="g" fill="#ffc27a">Supabase</text>
  <text x="24" y="172" class="l">View project  →
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </text>
</svg>

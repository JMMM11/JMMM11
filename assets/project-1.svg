<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-label="Hands: Real-time hand gesture recognition in the browser, turning camera input into 3D particle effects: hearts, spheres, explosions and text.">

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="10" viewBox="0 0 900 10" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffc27a"/>
      <stop offset="0.6" stop-color="#fb923c"/>
      <stop offset="0.85" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;900" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" fill="#ff7a18" fill-opacity="0.2"/>
  <rect x="0" y="3" width="900" height="4" rx="2" fill="url(#d)"/>
  <circle cx="450" cy="5" r="3" fill="#ff9a3c">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
